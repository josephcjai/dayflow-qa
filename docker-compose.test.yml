# QA's own stack: Postgres + the DayFlow API (built from a pinned, read-only checkout) + nginx.
#
# Owned entirely by dayflow-qa. Never references a dev-maintained image, a dev's already-running
# containers, or the dev repo's own docker-compose.yml. Ports are chosen so this can run alongside
# a developer's local DayFlow instance without conflict — see ARCHITECTURE.md §4 for the full
# rationale (including why hostname, not just port, matters for the web layer).
#
# Bring up:   npm run stack:up    (runs `checkout:dev-ref` first, see package.json)
# Tear down:  npm run stack:down
services:
  postgres-qa:
    image: postgres:15-alpine
    container_name: dayflow-qa-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-dayflow_qa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dayflow_qa_test_only}
      POSTGRES_DB: ${DB_NAME:-dayflow_qa}
    ports:
      - "${QA_DB_PORT:-5543}:5432"
    volumes:
      # Read-only reference to the pinned checkout's schema — applied automatically by the
      # official Postgres image's initdb hook. QA reads this file; it never writes to it.
      - ${DEV_CHECKOUT_DIR:-./.dev-checkout/DayFlow}/server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # A real named volume, NOT tmpfs — confirmed live while building this suite that tmpfs does
      # NOT reliably survive `docker compose restart` on Docker Desktop (WSL2 backend): the data
      # directory came back empty and Postgres silently re-ran initdb, which is exactly the wrong
      # foundation for api/06-restart-persistence.spec.ts (checklist #6 needs the DB to genuinely
      # survive a restart). `npm run stack:down` (which passes `-v`) removes this volume, so the
      # stack is still fully disposable between runs — only a same-run `restart` preserves it.
      - dayflow_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dayflow_qa} -d ${DB_NAME:-dayflow_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-qa:
    build:
      # Context is the pinned checkout's server/ dir — real dev source, unmodified.
      # `dockerfile:` is relative to this context; checkout-dev-ref.mjs copies
      # docker/api.Dockerfile in as server/Dockerfile.qa (a throwaway file inside the
      # gitignored checkout, recreated every run — see ARCHITECTURE.md §3).
      context: ${DEV_CHECKOUT_DIR:-./.dev-checkout/DayFlow}/server
      dockerfile: Dockerfile.qa
    container_name: dayflow-qa-api
    depends_on:
      postgres-qa:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: test
      JWT_SECRET: ${JWT_SECRET:-qa-test-only-secret-do-not-use-in-prod}
      ALLOWED_ORIGINS: ${QA_WEB_ORIGIN:-http://dayflow-qa.local:8280}
      DB_HOST: postgres-qa
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dayflow_qa}
      DB_USER: ${DB_USER:-dayflow_qa}
      DB_PASSWORD: ${DB_PASSWORD:-dayflow_qa_test_only}
    ports:
      - "${QA_API_PORT:-5100}:5000"

  nginx-qa:
    image: nginx:1.27-alpine
    container_name: dayflow-qa-nginx
    depends_on:
      - api-qa
    volumes:
      - ./docker/nginx.qa.conf:/etc/nginx/conf.d/default.conf:ro
      # Static frontend only — read-only mounts straight from the pinned checkout.
      - ${DEV_CHECKOUT_DIR:-./.dev-checkout/DayFlow}/index.html:/usr/share/nginx/html/index.html:ro
      - ${DEV_CHECKOUT_DIR:-./.dev-checkout/DayFlow}/src:/usr/share/nginx/html/src:ro
    ports:
      - "${QA_WEB_PORT:-8280}:80"

volumes:
  dayflow_qa_pgdata:
