# QA-owned nginx config — mirrors the production topology described in
# DayFlow/doc/DEPLOYMENT_LIGHTSAIL.md (static frontend + /api reverse-proxied to the Node
# process), scoped to the isolated QA stack. See ARCHITECTURE.md §4 for why testing through this
# proxy (rather than hitting the API container directly) matters for rate-limit/CORS coverage.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-qa:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
